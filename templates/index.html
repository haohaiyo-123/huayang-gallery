<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<title>花漾画廊</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --card:#1a1d24; --line:#23262e; --txt:#e6e6e6; --dim:#8a919e; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--txt); font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         padding-bottom: env(safe-area-inset-bottom); }
  header { padding: calc(10px + env(safe-area-inset-top)) 14px 10px; display: flex; align-items: center; gap: 10px;
           position: sticky; top: 0; background: rgba(15,17,21,.94); backdrop-filter: blur(10px);
           border-bottom: 1px solid var(--line); z-index: 10; }
  header h1 { font-size: 17px; font-weight: 600; }
  #status { font-size: 12px; color: var(--dim); margin-left: auto; }
  nav { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 10px; }
  nav button { background: var(--card); color: var(--txt); border: 1px solid var(--line); border-radius: 10px;
               padding: 9px 22px; font-size: 15px; }
  nav button:disabled { opacity: .35; }
  #pageLabel { font-size: 14px; color: var(--dim); min-width: 64px; text-align: center; }
  main { padding: 0 10px 40px; }
  .grid { column-count: 2; column-gap: 8px; }
  @media (min-width: 700px) { .grid { column-count: 3; } }
  @media (min-width: 1100px) { .grid { column-count: 4; } }
  .card { break-inside: avoid; margin-bottom: 8px; border-radius: 8px; overflow: hidden;
          background: var(--card); position: relative; cursor: zoom-in; }
  .card img { width: 100%; display: block; }
  .card.err { min-height: 80px; }
  .card.err::after { content: "✕"; position: absolute; inset: 0; display: flex; align-items: center;
          justify-content: center; color: var(--dim); font-size: 18px; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.95); display: none;
          align-items: center; justify-content: center; z-index: 100; }
  #lightbox img { max-width: 100vw; max-height: 100vh; object-fit: contain; }
  #sentinel { text-align: center; padding: 18px; color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>🌸 花漾画廊</h1>
  <span id="status"></span>
</header>
<nav>
  <button id="prev">‹ 上一页</button>
  <span id="pageLabel">1</span>
  <button id="next">下一页 ›</button>
</nav>
<main>
  <div class="grid" id="grid"></div>
  <div id="sentinel">加载中…</div>
</main>
<div id="lightbox"><img id="lbImg" alt=""></div>

<script>
let page = 1, loading = false;
const $ = id => document.getElementById(id);

function proxied(u) { return "/proxy?url=" + encodeURIComponent(u); }

async function load() {
  if (loading) return;
  loading = true;
  $("status").textContent = "抓取中…";
  try {
    const data = await (await fetch(`/api/images?source=yetu&page=${page}`)).json();
    if (data.images && data.images.length) {
      $("status").textContent = `${data.images.length} 张`;
      $("pageLabel").textContent = page;
      const grid = $("grid");
      data.images.forEach(u => {
        const card = document.createElement("div");
        card.className = "card";
        const img = new Image();
        img.loading = "lazy";
        img.onerror = () => card.classList.add("err");
        img.src = proxied(u);
        img.onclick = () => { $("lbImg").src = proxied(u); $("lightbox").style.display = "flex"; };
        card.appendChild(img);
        grid.appendChild(card);
      });
    } else {
      $("status").textContent = data.error ? "出错了" : "没有更多";
    }
  } catch (e) {
    $("status").textContent = "网络错误";
  }
  loading = false;
  $("sentinel").style.display = "none";
}

$("prev").onclick = () => { if (page > 1) { page--; $("grid").innerHTML = ""; window.scrollTo(0,0); load(); } };
$("next").onclick = () => { page++; $("grid").innerHTML = ""; window.scrollTo(0,0); load(); };
$("lightbox").onclick = () => { $("lightbox").style.display = "none"; };
load();
</script>
</body>
</html>
